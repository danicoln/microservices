spring.application.name=pedidos-api

# DATA SOURCE
spring.datasource.url=jdbc:postgresql://localhost:5432/pedidos_bd

spring.datasource.username=postgres
spring.datasource.password=lincoln10
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/HIBERNATE
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#SPRINGDOC OPENAPI
springdoc.swagger-ui.path=/api-docs.html
springdoc.api-docs.path=/api-docs

#Config RABBITMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.username=rabbitmq
spring.rabbitmq.password=rabbitmq
spring.rabbitmq.port=5672

#Custom config RABBITMQ
rabbitmq.exchange.name=pedidos.v1.pedido-criado